
{% extends "base.html" %}

{% block content %}
<div class="ff-dashboard">

<h1>{{ tenant.name }} Dashboard</h1>

<div class="ff-metrics">
  <div class="ff-card">
     <h3>Total Raised</h3>
     <p>${{ total }}</p>
  </div>
</div>

<h2>Recent Donations</h2>

<ul>
{% for d in donations %}
<li>{{ d.name }} — ${{ d.amount_dollars }}</li>
{% endfor %}
</ul>

</div>
{% endblock %}
